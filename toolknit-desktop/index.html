<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title data-i18n="app.title">ToolKnit 桌面版</title>
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <!-- 标题栏 -->
  <header class="titlebar" data-tauri-drag-region>
    <span class="titlebar-text" data-i18n="app.title">ToolKnit 桌面版</span>
    <div class="titlebar-controls">
      <button class="tb-btn" data-action="minimize" title="最小化">─</button>
      <button class="tb-btn" data-action="maximize" title="最大化">□</button>
      <button class="tb-btn tb-close" data-action="close" title="关闭">✕</button>
    </div>
  </header>

  <div class="app-body">
    <nav class="sidebar" id="sidebar"></nav>
    <main class="content" id="content"></main>
  </div>

  <footer class="statusbar" id="statusbar"></footer>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
