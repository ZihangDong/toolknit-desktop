[package]
name = "toolknit-desktop"
version = "2.3.1"
description = "ToolKnit Desktop App"
edition = "2021"
rust-version = "1.88"

[lib]
name = "toolknit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
base64 = "0.22.1"
hex = "0.4"
tauri = { version = "2.11.2", features = ["custom-protocol", "tray-icon", "protocol-asset"] }
tauri-plugin-log = "2.9.0"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-dialog = "2.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "macros", "fs", "time"] }
dirs = "5"
opener = "0.7"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
sha1 = "0.10"
md-5 = "0.10"
hmac = "0.12"
aes-gcm = "0.10"
argon2 = "0.5"
flate2 = "1"
getrandom = "0.2"
zeroize = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
libloading = "0.8"
ort = { version = "=2.0.0-rc.10", default-features = false, features = ["directml", "load-dynamic"] }
ndarray = "0.16"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_Graphics_Gdi"] }
