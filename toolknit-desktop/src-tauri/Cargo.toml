[package]
name = "toolknit-desktop"
version = "1.2.8"
description = "ToolKnit Desktop App"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "toolknit_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
base64 = "0.22.1"
tauri = { version = "2.11.2", features = ["protocol-asset", "tray-icon", "devtools"] }
tauri-plugin-log = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
tauri-plugin-dialog = "2.7.1"
tokio = { version = "1", features = ["rt-multi-thread", "process", "io-util", "macros", "fs"] }
dirs = "5"
opener = "0.7"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "bmp", "gif"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10"
flate2 = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.54", features = ["Win32_System_SystemInformation", "Win32_UI_Input_KeyboardAndMouse"] }
