name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: cd toolknit-desktop && npm ci

      - name: Build Tauri
        run: cd toolknit-desktop && npm run tauri build

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: toolknit-desktop/src-tauri/target/release/bundle/nsis/*.exe
          draft: false
          prerelease: false
